name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      ENABLE_LOG_WATCHER: "0"
      ALERT_DB_PATH: /tmp/alerts-ci.db
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Lint (errors only)
        run: >
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          --exclude .git,__pycache__,venv,.venv

      - name: Run tests
        run: pytest -q --tb=short

      - name: Smoke test the running app
        run: |
          python app.py > app_smoke.log 2>&1 &
          APP_PID=$!
          curl --fail --silent --show-error --retry 15 --retry-delay 1 --retry-connrefused http://127.0.0.1:5000/health
          echo
          curl --fail --silent --show-error -X POST http://127.0.0.1:5000/alert \
            -H "Content-Type: application/json" \
            -d '{"type":"Flood","message":"CI smoke test","location":"Mumbai"}'
          echo
          curl --fail --silent --show-error http://127.0.0.1:5000/api/status > /dev/null
          kill $APP_PID || true

      - name: Show app log if something failed
        if: failure()
        run: cat app_smoke.log || true

  docker:
    name: Docker build and run
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Look for a Dockerfile
        id: df
        run: |
          if [ -f docker/backend/Dockerfile ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "path=docker/backend/Dockerfile" >> "$GITHUB_OUTPUT"
          elif [ -f Dockerfile ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "path=Dockerfile" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No Dockerfile yet - skipping Docker checks."
          fi

      - name: Build the Docker image
        if: steps.df.outputs.exists == 'true'
        run: docker build -f ${{ steps.df.outputs.path }} -t emergency-alert-monitor:ci .

      - name: Start the Docker container
        if: steps.df.outputs.exists == 'true'
        run: docker run -d --name eam -p 5000:5000 emergency-alert-monitor:ci

      - name: Wait for container to become healthy
        if: steps.df.outputs.exists == 'true'
        run: |
          TIMEOUT=60
          INTERVAL=2
          ELAPSED=0
          HEALTH_STATUS=""

          while [ $ELAPSED -lt $TIMEOUT ]; do
            STATE=$(docker inspect --format='{{.State.Status}}' eam 2>/dev/null || echo "not-found")
            HEALTH_STATUS=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' eam 2>/dev/null || echo "unknown")

            echo "Waiting for health ($ELAPSED/${TIMEOUT}s) - State: $STATE, Health: $HEALTH_STATUS"

            if [ "$HEALTH_STATUS" = "healthy" ]; then
              echo "Container is healthy and ready to accept requests."
              break
            fi

            if [ "$STATE" = "exited" ] || [ "$STATE" = "dead" ] || [ "$HEALTH_STATUS" = "unhealthy" ]; then
              echo "Container failed (State: $STATE, Health: $HEALTH_STATUS)"
              break
            fi

            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          if [ "$HEALTH_STATUS" != "healthy" ]; then
            echo "Container failed to become healthy within ${TIMEOUT}s (status: $HEALTH_STATUS)"
            echo "=== docker ps -a ==="
            docker ps -a || true
            echo "=== docker inspect eam ==="
            docker inspect eam || true
            echo "=== docker logs eam ==="
            docker logs eam || true
            exit 1
          fi

      - name: Check /health endpoint
        if: steps.df.outputs.exists == 'true'
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 1 --retry-all-errors \
            http://127.0.0.1:5000/health
          echo

      - name: Check /alert endpoint (POST JSON)
        if: steps.df.outputs.exists == 'true'
        run: |
          curl --fail --silent --show-error \
            -X POST http://127.0.0.1:5000/alert \
            -H "Content-Type: application/json" \
            -d '{"type":"Flood","message":"Docker CI test","location":"Mumbai"}'
          echo

      - name: Check /api/status endpoint
        if: steps.df.outputs.exists == 'true'
        run: |
          curl --fail --silent --show-error http://127.0.0.1:5000/api/status > /dev/null
          echo

      - name: Show container diagnostics if something failed
        if: failure() && steps.df.outputs.exists == 'true'
        run: |
          echo "=== docker ps -a ==="
          docker ps -a || true
          echo "=== docker inspect eam ==="
          docker inspect eam || true
          echo "=== docker logs eam ==="
          docker logs eam || true

      - name: Stop and remove container
        if: always() && steps.df.outputs.exists == 'true'
        run: |
          docker stop eam || true
          docker rm eam || true

  compose:
    name: Compose + Nginx (Phase 12)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Check for Compose and Nginx config
        id: cf
        run: |
          if [ -f docker/compose.yaml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "compose_file=docker/compose.yaml" >> "$GITHUB_OUTPUT"
          elif [ -f compose.yaml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "compose_file=compose.yaml" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "compose.yaml not found — skipping Compose checks."
          fi

      - name: Validate Compose syntax
        if: steps.cf.outputs.exists == 'true'
        run: docker compose -f ${{ steps.cf.outputs.compose_file }} config --quiet

      - name: Build and start services
        if: steps.cf.outputs.exists == 'true'
        run: docker compose -f ${{ steps.cf.outputs.compose_file }} up --build -d

      - name: Wait for backend to be healthy
        if: steps.cf.outputs.exists == 'true'
        run: |
          for i in $(seq 1 20); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' eam-backend 2>/dev/null || echo "missing")
            echo "Attempt $i: backend health = $STATUS"
            if [ "$STATUS" = "healthy" ]; then break; fi
            sleep 3
          done
          [ "$STATUS" = "healthy" ] || { echo "Backend never became healthy"; exit 1; }

      - name: Wait for Nginx to be healthy
        if: steps.cf.outputs.exists == 'true'
        run: |
          for i in $(seq 1 10); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' eam-nginx 2>/dev/null || echo "missing")
            echo "Attempt $i: nginx health = $STATUS"
            if [ "$STATUS" = "healthy" ]; then break; fi
            sleep 3
          done
          [ "$STATUS" = "healthy" ] || { echo "Nginx never became healthy"; exit 1; }

      - name: Test Nginx self-health endpoint (/nginx-health)
        if: steps.cf.outputs.exists == 'true'
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 2 --retry-connrefused \
            http://127.0.0.1/nginx-health
          echo

      - name: Test GET /health through Nginx (port 80)
        if: steps.cf.outputs.exists == 'true'
        run: |
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 2 --retry-connrefused \
            http://127.0.0.1/health
          echo

      - name: Test POST /alert through Nginx (port 80)
        if: steps.cf.outputs.exists == 'true'
        run: |
          curl --fail --silent --show-error \
            -X POST http://127.0.0.1/alert \
            -H "Content-Type: application/json" \
            -d '{"type":"Flood","message":"Nginx CI test","location":"Mumbai"}'
          echo

      - name: Test GET /api/status through Nginx (port 80)
        if: steps.cf.outputs.exists == 'true'
        run: |
          curl --fail --silent --show-error http://127.0.0.1/api/status > /dev/null
          echo

      - name: Show service logs if something failed
        if: failure() && steps.cf.outputs.exists == 'true'
        run: |
          echo "=== nginx logs ==="
          docker compose -f ${{ steps.cf.outputs.compose_file }} logs nginx || true
          echo "=== backend logs ==="
          docker compose -f ${{ steps.cf.outputs.compose_file }} logs backend || true

      - name: Tear down Compose services
        if: always() && steps.cf.outputs.exists == 'true'
        run: docker compose -f ${{ steps.cf.outputs.compose_file }} down --volumes --remove-orphans
