name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      ENABLE_LOG_WATCHER: "0"
      ALERT_DB_PATH: /tmp/alerts-ci.db
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Lint (errors only)
        run: >
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          --exclude .git,__pycache__,venv,.venv

      - name: Run tests
        run: pytest -q --tb=short

      - name: Smoke test the running app
        run: |
          python app.py > app_smoke.log 2>&1 &
          APP_PID=$!
          curl --fail --silent --show-error --retry 15 --retry-delay 1 --retry-connrefused http://127.0.0.1:5000/health
          echo
          curl --fail --silent --show-error -X POST http://127.0.0.1:5000/alert \
            -H "Content-Type: application/json" \
            -d '{"type":"Flood","message":"CI smoke test","location":"Mumbai"}'
          echo
          curl --fail --silent --show-error http://127.0.0.1:5000/api/status > /dev/null
          kill $APP_PID || true

      - name: Show app log if something failed
        if: failure()
        run: cat app_smoke.log || true

  docker:
    name: Docker build and run
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Look for a Dockerfile
        id: df
        run: |
          if [ -f Dockerfile ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No Dockerfile yet - skipping Docker checks."
          fi

      - name: Build the Docker image
        if: steps.df.outputs.exists == 'true'
        run: docker build -t emergency-alert-monitor:ci .

      - name: Run the container and check /health
        if: steps.df.outputs.exists == 'true'
        run: |
          docker run -d --name eam -p 5000:5000 emergency-alert-monitor:ci
          curl --fail --silent --show-error --retry 15 --retry-delay 2 --retry-connrefused http://127.0.0.1:5000/health
          echo

      - name: Show container logs if something failed
        if: failure() && steps.df.outputs.exists == 'true'
        run: docker logs eam || true
