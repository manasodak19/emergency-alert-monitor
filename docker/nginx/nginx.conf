# =============================================================================
# Phase 12 — Nginx Reverse Proxy Configuration
# Emergency Alert Monitor
#
# Listens on port 80 and forwards all requests to the Flask backend
# running at http://backend:5000 inside the Docker network.
# The Flask port (5000) is never exposed directly to the host.
# =============================================================================

# Run as the default nginx user (non-root) inside the official image.
# Number of worker processes — "auto" matches the number of CPU cores.
worker_processes auto;

# Error log destination and minimum severity level.
error_log /var/log/nginx/error.log warn;

# Store the nginx master process PID.
pid /tmp/nginx.pid;

events {
    # Maximum simultaneous connections per worker process.
    worker_connections 1024;
}

http {
    # ── Basic MIME and encoding ──────────────────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Access log format ────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    # ── Performance ──────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # ── Security: hide Nginx version from error pages and headers ────────
    server_tokens off;

    # ── Upstream — the Flask backend service (resolved by Docker DNS) ─────
    upstream backend {
        server backend:5000;
        keepalive 16;
    }

    # ── Main virtual server ──────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Maximum allowed size of a client request body (JSON alert payloads).
        client_max_body_size 1m;

        # ── Timeouts ────────────────────────────────────────────────────
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # ── Common proxy headers sent to Flask ──────────────────────────
        # These let Flask know the real client IP and protocol even
        # though it only sees connections from the Nginx container.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Preserve original HTTP method (GET, POST, etc.).
        proxy_pass_request_headers on;

        # Preserve query strings and request body (required for POST /alert).
        proxy_pass_request_body on;

        # Disable buffering of upstream responses for streaming/SSE endpoints.
        proxy_buffering off;

        # Use HTTP/1.1 for upstream to support keepalive.
        proxy_http_version 1.1;
        # Clear the Connection header so keepalive works through the proxy.
        proxy_set_header Connection "";

        # ── Nginx health check endpoint ──────────────────────────────────
        # This endpoint tests Nginx itself and returns 200 immediately.
        # It is used by the Docker healthcheck for the nginx container.
        # It does NOT proxy to the backend.
        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "nginx ok\n";
        }

        # ── Proxy all other requests to Flask ───────────────────────────
        location / {
            proxy_pass http://backend;
        }
    }
}
